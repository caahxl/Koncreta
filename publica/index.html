<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koncreta | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --cor-primaria: #d35400; 
            --cor-secundaria: #2c3e50;
            --cor-fundo-card: #ffffff;
        }

        body {
            background-color: #fcfcfc;
            background-image: radial-gradient(#e5e5e5 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-login {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-top: 5px solid var(--cor-primaria);
            background-color: var(--cor-fundo-card);
        }

        .btn-primary {
            background-color: var(--cor-primaria);
            border-color: var(--cor-primaria);
            padding: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #a84300;
            border-color: #a84300;
            transform: translateY(-2px);
        }

        .logo-circulo {
            width: 80px;
            height: 80px;
            background-color: var(--cor-secundaria);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.2rem; /* Leve aumento para destacar o ícone de usuário */
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.2);
            border: 3px solid var(--cor-primaria);
        }

        .form-control:focus {
            border-color: var(--cor-primaria);
            box-shadow: 0 0 0 0.25rem rgba(211, 84, 0, 0.15);
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col col-md-8 col-lg-5 col-xl-4">

                <div alerta class="alert alert-danger text-center fw-semibold shadow-sm border-0 mb-4 d-none">
                    <i class="bi bi-x-circle-fill me-2"></i> Usuário ou Senha inválidos!
                </div>

                <div class="card card-login p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="logo-circulo">
                            <i class="bi bi-person-circle"></i>
                        </div>
                        <h1 class="h3 fw-bold text-dark">Koncreta</h1>
                        <p class="text-muted small">Controle de Estoque</p>
                    </div>

                    <form method="post" action="/login">

                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary small text-uppercase" for="user">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input class="form-control border-start-0 ps-0" type="text" name="user" id="user" placeholder="Digite seu usuário" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary small text-uppercase" for="senha">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input class="form-control border-start-0 ps-0" type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                            </div>
                        </div>

                        <button class="btn btn-primary w-100 shadow-sm rounded-pill text-uppercase tracking-wider">
                            Entrar no Sistema
                        </button>
                    </form>
                </div>
                
                <p class="text-center mt-4 text-muted small">
                    &copy; 2026 Koncreta - Materiais de Construção
                </p>
            </div>
        </div>
    </main>

    <script>
        // Recuperar parâmetros da URL
        const params = new URLSearchParams(window.location.search)
        const msg = params.get("msg")

        if(msg == "erro") {
            const alerta = document.querySelector("[alerta]")
            alerta.classList.remove("d-none")
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
